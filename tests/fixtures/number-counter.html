<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Number Counter fixture</title>
	<style>
		body { margin: 0; font-family: sans-serif; }
		.spacer { height: 1400px; }
	</style>
</head>
<body>
	<div class="ltxe-number-counter" data-ltxe-counter='{"target":500,"duration":400,"easing":"linear","delimiter":"none","decimals":0,"once":true}'>
		<div class="ltxe-number-counter__value">
			<span class="ltxe-number-counter__prefix">$</span>
			<span class="ltxe-number-counter__digits">0</span>
			<span class="ltxe-number-counter__suffix">+</span>
		</div>
		<div class="ltxe-number-counter__title">Happy Clients</div>
	</div>
	<div class="spacer"></div>
	<p id="bottom">Bottom</p>
</body>
</html>
