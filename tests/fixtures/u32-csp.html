<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>LandTech Extras U32 CSP fixture</title>
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="./u32-csp.css">
</head>
<body>
	<main>
		<h1>CSP-safe widget fixture</h1>
		<p>This page uses a strict policy with no unsafe-inline. Actions use data-ltxe-action.</p>
		<div class="ltxe-share">
			<button type="button" class="ltxe-share__btn" data-ltxe-action="copy-link" data-ltxe-url="https://extrasforelementor.com/">Copy link</button>
			<button type="button" class="ltxe-share__btn" data-ltxe-action="print">Print</button>
			<a class="ltxe-share__btn" href="https://extrasforelementor.com/" data-ltxe-action="share-popup">Share</a>
		</div>
		<div class="ltxe-cq-wrapper" data-ltxe-cq="ltxe-cq-demo">
			<p>Container query wrapper without a style attribute.</p>
		</div>
		<div class="ltxe-progress-bar ltxe-progress-bar--horizontal">
			<div class="ltxe-progress-bar__fill"></div>
		</div>
	</main>
	<script src="./u32-csp-core.js"></script>
</body>
</html>
