name: PHPUnit and frontend audits

on:
  push:
    branches: [ trunk, master, main, develop ]
  pull_request:

jobs:
  unit:
    name: PHPUnit unit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none

      - name: Composer install
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: PHPUnit
        run: vendor/bin/phpunit -c phpunit.xml.dist

  axe-csp:
    name: axe fixture and CSP audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: npm ci
        run: npm ci

      - name: WCAG fixture (axe)
        run: npm run test:u30-axe

      - name: CSP audit
        run: npm run test:u32-csp
